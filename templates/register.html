{% extends "base.html" %}

{% block title %}Registration{% endblock %}
{% block page_class %}page--form{% endblock %}

{% block content %}
<form id="regForm" class="card"
      data-districts-url="{{ url_for('static', path='data/india-states-districts.json') }}">
  <h2>Registration</h2>

  <label for="name">Name</label>
  <input type="text" id="name" required />

  <label for="country">Country</label>
  <input type="text" id="country" value="India" readonly />

  <label for="state">State</label>
  <select id="state" required>
    <option value="">-- Select State --</option>
  </select>

  <label for="district">District</label>
  <select id="district" required disabled>
    <option value="">-- Select State first --</option>
  </select>

  <label for="village">Village</label>
  <input type="text" id="village" required />

  <label for="mobile">Mobile Number</label>
  <div class="mobile-group">
    <span class="prefix">+91</span>
    <input type="tel" id="mobile" maxlength="10" inputmode="numeric"
           placeholder="10-digit number" required />
  </div>

  <label for="age">Age</label>
  <input type="number" id="age" min="1" max="119" required />

  <label for="work">Work</label>
  <input type="text" id="work" required />

  <button type="submit" id="submitBtn">Register</button>
  <div id="msg" class="msg"></div>
</form>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', path='js/register.js') }}"></script>
{% endblock %}
