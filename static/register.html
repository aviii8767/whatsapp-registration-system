<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Registration</title>
<style>
  body { font-family: sans-serif; background: #f5f5f5; padding: 24px; }
  form { max-width: 400px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 10px; }
  label { display: block; margin-top: 12px; font-weight: bold; }
  input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
  button { margin-top: 18px; padding: 10px; width: 100%; background: #128C7E; color: #fff; border: none; border-radius: 6px; }
  #msg { margin-top: 10px; }
    .mobile-group { display: flex; margin-top: 4px; }
  .mobile-group .prefix {
    padding: 8px 10px;
    background: #eee;
    border: 1px solid #ccc;
    border-right: none;
    border-radius: 6px 0 0 6px;
    display: flex;
    align-items: center;
    font-weight: bold;
  }
  .mobile-group input {
    border-radius: 0 6px 6px 0;
    margin-top: 0;
  }
    input, select { width: 100%; padding: 10px; margin-top: 4px; box-sizing: border-box; }
</style>
</head>
<body>
<form id="regForm">
  <h2>Registration</h2>

  <label>Name</label>
  <input type="text" id="name" required />

    <label>Country</label>
  <input type="text" id="country" value="India" readonly style="background:#f0f0f0;" />

  <label>State</label>
  <select id="state" required>
    <option value="">-- Select State --</option>
  </select>

  <label>District</label>
  <select id="district" required disabled>
    <option value="">-- Select State first --</option>
  </select>

  <label>Village</label>
  <input type="text" id="village" required />

  <label>Mobile Number</label>
  <div class="mobile-group">
    <span class="prefix">+91</span>
    <input type="tel" id="mobile" maxlength="10" inputmode="numeric" placeholder="10-digit number" required/>
  </div>

  <label>Age</label>
  <input type="number" id="age" required />

  <label>Work</label>
  <input type="text" id="work" required />

  <button type="submit">Register</button>
  <div id="msg"></div>
</form>

<script>
const stateSelect = document.getElementById('state');
const districtSelect = document.getElementById('district');
let statesData = {};

fetch('/static/india-states-districts.json')
  .then((res) => res.json())
  .then((data) => {
    statesData = data;
    Object.keys(data).sort().forEach((state) => {
      const opt = document.createElement('option');
      opt.value = state;
      opt.textContent = state;
      stateSelect.appendChild(opt);
    });
  });

stateSelect.addEventListener('change', () => {
  const selected = stateSelect.value;
  districtSelect.innerHTML = '';

  if (!selected || !statesData[selected]) {
    districtSelect.innerHTML = '<option value="">-- Select State first --</option>';
    districtSelect.disabled = true;
    return;
  }

  districtSelect.disabled = false;
  districtSelect.innerHTML = '<option value="">-- Select District --</option>';
  statesData[selected].forEach((district) => {
    const opt = document.createElement('option');
    opt.value = district;
    opt.textContent = district;
    districtSelect.appendChild(opt);
  });
});


document.getElementById('regForm').addEventListener('submit', async (e) => {
  e.preventDefault();  // stop the browser from doing a normal page reload on submit

  const payload = {
    name: document.getElementById('name').value,
    village: document.getElementById('village').value,
    state: stateSelect.value,
    district: districtSelect.value,
    mobile: document.getElementById('mobile').value,
    age: parseInt(document.getElementById('age').value),
    work: document.getElementById('work').value,
  };

  const res = await fetch('/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  const data = await res.json();
  const msgDiv = document.getElementById('msg');
  msgDiv.style.color = res.ok ? 'green' : 'red';
  msgDiv.textContent = res.ok ? 'Registered!' : data.detail;
});
</script>
</body>
</html>
